name: CI & Deploy

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# Allow the deploy job to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; queued runs supersede rather than cancel a live one.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  # The smoke test is opt-in and not part of CI, so CI never needs a browser.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Verify the service worker was generated
        run: test -f dist/sw.js && test -f dist/manifest.webmanifest

      - name: Upload Pages artifact
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' &&
           (github.ref == 'refs/heads/main' ||
            github.ref == 'refs/heads/claude/forged-fitness-pwa-74y1yz'))
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: verify
    # Deploys from main, and — until this branch is merged — from the feature
    # branch too, so the live app is available for testing on a phone without
    # waiting for a merge. Drop the branch clause once this lands on main.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/main' ||
        github.ref == 'refs/heads/claude/forged-fitness-pwa-74y1yz'))
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # actions/deploy-pages fails with a bare 404 and a stack trace when the
      # repository has no Pages site, which reads like a broken build rather
      # than a one-time setting. Detect that specific case up front.
      #
      # Only a definitive 404 skips the deploy. Any other status — including a
      # permissions error or an outage — falls through and lets the real deploy
      # step fail loudly, so this can never quietly stop publishing.
      - name: Check whether GitHub Pages is enabled
        id: pages
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${{ github.api_url }}/repos/${{ github.repository }}/pages" || echo "000")
          echo "Pages API returned HTTP $code"
          if [ "$code" = "404" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Explain how to enable GitHub Pages
        if: steps.pages.outputs.enabled != 'true'
        run: |
          echo "::warning title=GitHub Pages is not enabled::Enable it at Settings → Pages → Build and deployment → Source: GitHub Actions, then re-run this workflow."
          {
            echo "## Deployment skipped — GitHub Pages is not enabled"
            echo
            echo "The build succeeded and the site artifact is ready, but this repository has no"
            echo "Pages site to deploy into."
            echo
            echo "**Enable it once:** Settings → Pages → Build and deployment → Source: \`GitHub Actions\`"
            echo
            echo "Then re-run this workflow. The site will publish to"
            echo "<https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/>."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy
        id: deployment
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
